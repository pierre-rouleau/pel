# YAML FILE: build-windows.yml
#
# Purpose   : Manual Windows build of PEL code (byte-compilation + ERT tests).
# Created   : 2026.
# Author    : Pierre Rouleau <prouleau001@gmail.com>
#
# Notes:
# - This workflow is triggered only manually (workflow_dispatch).
# - Uses jcs090218/setup-emacs which supports Linux, macOS, and Windows.
# - Compilation step uses bash (Git Bash) so GNU Make POSIX shell recipes work.
# - ERT tests step uses PowerShell (pwsh) via bin/ert-test.ps1, the Windows
#   equivalent of bin/ert-test, to run every test/pel-*-test.el test file.

# [:todo 2026-05-22, by Pierre Rouleau: Several RRT test fails due to
#                    Unix file name conventions used in test code. For the moment
#                    running the tests is disabled.]

name: Build (Windows - manual)

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        emacs_version:
          - '28.1'
          - '29.4'
          - '30.1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Emacs ${{ matrix.emacs_version }}
        uses: jcs090218/setup-emacs@master
        with:
          version: ${{ matrix.emacs_version }}

      - name: Verify Emacs
        shell: bash
        run: emacs --version

      - name: Compile (byte-compile all PEL files)
        shell: bash
        env:
          EMACS_INIT: ${{ github.workspace }}/ci/init.el
        run: make compile-only

