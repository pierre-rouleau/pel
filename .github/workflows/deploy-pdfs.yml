# YAML FILE: deploy-pdfs.yml
#
# Purpose   : Copy PEL PDF files to a Pages sub-directory; copy other
#             top-level doc/pdf files (index.html, index.rst, …) to the
#             Pages root.
# Created   : Wednesday, May 20 2026.
# Author    : Pierre Rouleau <prouleau001@gmail.com>
# Time-stamp: <2026-05-20 23:22:55 EDT, updated by Pierre Rouleau>
# ----------------------------------------------------------------------------
# Module Description
# ------------------
#
# Copy the PEL PDF files into Github Pages to allow browsers to render them
# easily.
#
# Github sends raw hosted PDF files with a HTTP header intended to force
# security isolation (Content-Disposition: attachment; filename=...) which
# prevents PDF rendering on most browsers except Firefox.  Github Pages does
# not apply that header, so the files are copied there instead.
#
# Source:       repo:  doc/pdf/**
# Destination:  Pages site /pel-table-based-documentation1/  (*.pdf files)
#               Pages site /                                  (all other files)

# ----------------------------------------------------------------------------
# Dependencies
# ------------
#
# Github Actions, Github Pages

# ----------------------------------------------------------------------------
# Code
# ----

name: Deploy PEL PDFs to Pages

on:
  push:
    branches:
      - master          # Runs whenever master branch is updated …
    paths:
      - 'doc/pdf/**'    # … but only when doc/pdf tree actually changes
  workflow_dispatch:    # Allows manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Stage files into Pages layout
        run: |
          mkdir -p _site/pel-table-based-documentation1

          # Copy *.pdf files (preserving sub-tree) into the Pages sub-directory.
          rsync -a \
                --include='*/' \
                --include='*.pdf' \
                --exclude='*' \
                doc/pdf/ _site/pel-table-based-documentation1/

          # Copy every non-PDF file at the root of doc/pdf to the Pages root
          # (e.g. index.html, index.rst).
          find doc/pdf -maxdepth 1 -type f ! -name '*.pdf' -exec cp {} _site/ \;

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload the staged tree so the sub-directory layout is preserved.
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# ----------------------------------------------------------------------------
